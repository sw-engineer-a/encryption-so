plugins {
    id "com.android.application"
}

android {
    namespace "com.mh1721.cryptoapp"
    compileSdk 34

    defaultConfig {
        applicationId "com.mh1721.cryptoapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDir "../../so/java"
            jniLibs.srcDir "../../so/dist/jniLibs"
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
}
